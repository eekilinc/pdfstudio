<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="40%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>

    <!-- Document Page Gradient -->
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- Folded Corner Gradient -->
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- PDF Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#4c0519" flood-opacity="0.45"/>
    </filter>
    
    <filter id="pageShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- 1. Background Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" filter="url(#dropShadow)"/>

  <!-- Top Glass Highlight Overlay -->
  <rect x="24" y="24" width="464" height="232" rx="104" fill="#ffffff" fill-opacity="0.08"/>

  <!-- 2. The PDF Document Sheet -->
  <g filter="url(#pageShadow)">
    <!-- Main Sheet Body (with top-right cutout for fold) -->
    <path d="M 128 100 L 308 100 L 384 176 L 384 404 C 384 415 375 424 364 424 L 148 424 C 137 424 128 415 128 404 Z" fill="url(#pageGrad)"/>
    
    <!-- Folded Corner Flap -->
    <path d="M 308 100 L 308 166 C 308 172 312 176 318 176 L 384 176 Z" fill="url(#foldGrad)"/>
  </g>

  <!-- 3. Red "PDF" Badge on Document -->
  <rect x="110" y="220" width="220" height="68" rx="12" fill="url(#badgeGrad)" filter="url(#pageShadow)"/>
  
  <text x="220" y="268" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" 
        font-size="44" 
        font-weight="900" 
        letter-spacing="4"
        text-anchor="middle" 
        fill="#ffffff">PDF</text>

  <!-- 4. Modern Document Content Lines -->
  <rect x="160" y="318" width="190" height="14" rx="7" fill="#cbd5e1"/>
  <rect x="160" y="348" width="140" height="14" rx="7" fill="#e2e8f0"/>
  <rect x="160" y="378" width="165" height="14" rx="7" fill="#e2e8f0"/>

  <!-- 5. Gold "PRO" Sparkle / Star Emblem -->
  <g transform="translate(360, 360)">
    <circle cx="0" cy="0" r="38" fill="url(#goldGrad)" filter="url(#pageShadow)"/>
    <path d="M 0 -22 L 6 -6 L 22 0 L 6 6 L 0 22 L -6 6 L -22 0 L -6 -6 Z" fill="#ffffff"/>
  </g>
</svg>